# Runs the relay locally. To deploy it, run the published image
# (ghcr.io/bunchjesse/rendezvous-relay) the same way; see README.md.
services:
  relay:
    build: .
    image: rendezvous-relay
    ports:
      - "3340:3340"
    environment:
      # Comma-separated; leave unset to serve every namespace.
      - RELAY_ALLOWED_NAMESPACES=${RELAY_ALLOWED_NAMESPACES:-}
    restart: unless-stopped
